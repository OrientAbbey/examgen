# Render (plan gratuit) : disque ÉPHÉMÈRE + mise en veille après 15 min. La banque est restaurée au
# démarrage depuis bootstrap/banque.json ; l'historique d'unicité et le journal sont, eux, perdus.
services:
  - type: web
    name: examgen
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: EXAMGEN_ADMIN_TOKEN
        generateValue: true
      - key: EXAMGEN_TRUST_PROXY
        value: "1"
      - key: EXAMGEN_AI_PUBLIC
        value: "0"
      # Assistant IA facultatif (renseigner dans le tableau de bord Render ; voir docs/ASSISTANT_IA.md)
      - key: EXAMGEN_LLM_MODEL
        sync: false
      - key: EXAMGEN_LLM_BASE_URL
        sync: false
      - key: EXAMGEN_LLM_API_KEY
        sync: false
